<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumaWorks — Billing Assistant</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f8cff; --me: #1f3a5f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .logo { width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, #4f8cff, #7affc9); }
  header h1 { font-size: 15px; font-weight: 600; }
  header small { color: var(--muted); margin-left: auto; }
  main { display: flex; flex: 1; min-height: 0; }
  #side {
    width: 260px; border-right: 1px solid var(--border); background: var(--panel);
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  #side label { font-size: 12px; color: var(--muted); }
  #side input {
    width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: monospace; font-size: 12px;
  }
  #side button, #send {
    padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 13px;
  }
  #invoices { overflow-y: auto; font-size: 12.5px; }
  .inv { padding: 8px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
  .inv b { color: var(--accent); }
  .inv .st { color: var(--muted); }
  #chatwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .me  { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .sys { align-self: center; color: var(--muted); font-size: 12.5px; }
  form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel); }
  form input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>LumaWorks Billing Assistant</h1>
  <small>customer portal</small>
</header>
<main>
  <div id="side">
    <label for="key">Your API key</label>
    <input id="key" placeholder="lw_live_..." autocomplete="off">
    <button id="load">Load my invoices</button>
    <div id="invoices"></div>
  </div>
  <div id="chatwrap">
    <div id="chat">
      <div class="msg sys">Enter your API key, then ask about your invoices.</div>
    </div>
    <form id="f">
      <input id="box" placeholder='e.g. What is the status of INV-1001?' autocomplete="off">
      <button id="send" type="submit">Send</button>
    </form>
  </div>
</main>
<script>
  const chat = document.getElementById("chat");
  const key = document.getElementById("key");
  key.value = localStorage.getItem("lw_key") || "";

  function add(cls, text) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function headers() {
    localStorage.setItem("lw_key", key.value.trim());
    return { "X-API-Key": key.value.trim(), "Content-Type": "application/json" };
  }

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const box = document.getElementById("box");
    const text = box.value.trim();
    if (!text) return;
    add("me", text);
    box.value = "";
    try {
      const r = await fetch("/assistant/chat", {
        method: "POST", headers: headers(), body: JSON.stringify({ message: text }),
      });
      if (!r.ok) { add("sys", "⚠ " + r.status + " — " + (await r.text())); return; }
      add("bot", (await r.json()).reply);
    } catch (err) { add("sys", "⚠ network error: " + err); }
  });

  document.getElementById("load").addEventListener("click", async () => {
    const el = document.getElementById("invoices");
    el.innerHTML = "";
    try {
      const r = await fetch("/api/invoices", { headers: headers() });
      if (!r.ok) { el.textContent = "⚠ " + r.status; return; }
      for (const inv of (await r.json()).invoices) {
        const d = document.createElement("div");
        d.className = "inv";
        d.innerHTML = "<b></b> <span class='st'></span><br>";
        d.querySelector("b").textContent = inv.id;
        d.querySelector(".st").textContent = inv.status;
        d.appendChild(document.createTextNode(inv.description + " — " + inv.amount + " " + inv.currency));
        el.appendChild(d);
      }
    } catch (err) { el.textContent = "⚠ " + err; }
  });
</script>
</body>
</html>
